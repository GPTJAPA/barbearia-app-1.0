<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container" style="max-width: 900px;">
        <h1>Agenda da Barbearia</h1>

        <!-- Filtro de Data -->
        <div style="margin-bottom: 20px; background: #f0f0f0; padding: 15px; border-radius: 5px;">
            <label for="filtro-data" style="font-weight: bold; margin-right: 10px;">Filtrar por Dia:</label>
            <input type="date" id="filtro-data" onchange="carregarAgenda()" style="width: auto; margin-bottom: 0;">
            <button onclick="limparFiltro()"
                style="padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px;">Ver Todos</button>
        </div>

        <table id="tabela-agenda">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Telefone</th>
                    <th>Serviço</th>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                <tr>
                    <td colspan="8" style="text-align: center;">Carregando agendamentos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ========================================== -->
    <!-- MODAL DE EDIÇÃO DO BARBEIRO                -->
    <!-- ========================================== -->
    <div id="modal-editar" class="modal-overlay" style="display: none;">
        <div class="modal-conteudo">
            <h2>✏️ Editar Horário</h2>
            
            <!-- Campo invisível para guardar o ID do cliente que estamos a editar -->
            <input type="hidden" id="edit-id">
            
            <h3 style="text-align: left; margin-top: 10px;">Nova Data</h3>
            <input type="date" id="edit-data">
            
            <h3 style="text-align: left; margin-top: 10px;">Novo Horário</h3>
            <input type="time" id="edit-hora" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 20px;">
            
            <button onclick="salvarEdicao()" class="btn-whatsapp" style="background-color: #f1c40f; color: black;">Salvar Alterações</button>
            <button onclick="fecharModalEdicao()" style="margin-top: 15px; background: none; border: none; color: #e74c3c; cursor: pointer; font-weight: bold;">Cancelar</button>
        </div>
    </div>

    <!-- Ligação ao JavaScript -->
    <script src="admin.js"></script>
</body>

</html>
