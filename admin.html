<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Barbearia Fidel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGOS LATERAIS NO FUNDO PRETO -->
    <img src="imagens/logo.png" class="logo-lateral logo-esquerda" alt="Logo Barbearia Esquerda">
    <img src="imagens/logo.png" class="logo-lateral logo-direita" alt="Logo Barbearia Direita">

    <!-- Cartão com classe exclusiva container-admin -->
    <div class="container container-admin">
        
        <h1 style="margin-bottom: 20px; color: #111;">Agenda da Barbearia</h1>

        <!-- Caixa de Filtro -->
        <div class="filtro-container">
            <label for="filtro-data"><strong>Filtrar por Dia:</strong></label>
            <div class="filtro-inputs">
                <input type="date" id="filtro-data" onclick="this.showPicker()" onchange="carregarAgenda()">
                <button onclick="limparFiltro()" class="btn-limpar-filtro">Ver Todos</button>
            </div>
        </div>

        <!-- Tabela Responsiva de Agendamentos -->
        <div class="tabela-wrapper">
            <table class="tabela-admin">
                <thead>
                    <tr>
                        <th style="width: 50px;">ID</th>
                        <th>Cliente</th>
                        <th>Telefone</th>
                        <th>Serviço</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Valor</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 20px;">A carregar agendamentos...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Modal de Edição de Horário -->
    <div id="modal-editar" class="modal-overlay" style="display: none;">
        <div class="modal-conteudo">
            <h3>Editar Agendamento</h3>
            <input type="hidden" id="edit-id">
            
            <label style="display: block; text-align: left; margin-top: 10px;">Nova Data:</label>
            <input type="date" id="edit-data" onclick="this.showPicker()">

            <label style="display: block; text-align: left; margin-top: 10px;">Novo Horário:</label>
            <input type="time" id="edit-hora">

            <button onclick="salvarEdicao()" class="btn-whatsapp" style="background-color: #27ae60; color: white;">Guardar Alterações</button>
            <button onclick="fecharModalEdicao()" style="margin-top: 10px; background: none; border: none; color: #e74c3c; cursor: pointer; font-weight: bold;">Cancelar</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
